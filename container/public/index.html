<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroFrontend Shop</title>
    <style>
      body {
        margin: 0;
        background: #f3f4f6;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #1f2937;
      }
      .container-header {
        background: #111827;
        color: #ffffff;
        padding: 18px 24px;
      }
      .container-header h1 {
        margin: 0;
        font-size: 20px;
      }
      .container-header p {
        margin: 4px 0 0;
        font-size: 13px;
        color: #9ca3af;
      }
      .container-layout {
        max-width: 1000px;
        margin: 24px auto;
        padding: 0 16px;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 700px) {
        .container-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="container-header">
      <h1>MicroFrontend Shop</h1>
      <p>Container app: composes the Products and Cart microfrontends</p>
    </header>
    <main class="container-layout">
      <div id="my-products"></div>
      <div id="my-cart"></div>
    </main>
  </body>
</html>
